 <radialGradient id="veil"><stop stop-color="#f7f1e6" stop-opacity=".86"/><stop offset=".7" stop-color="#f7f1e6" stop-opacity=".48"/><stop offset="1" stop-color="#f7f1e6" stop-opacity=".08"/></radialGradient>
 <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#fff" opacity=".12"/></pattern>
