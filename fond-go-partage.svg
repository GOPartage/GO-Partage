 <linearGradient id="goldSide" x2="1" y2="0"><stop stop-color="#a85b12"/><stop offset=".45" stop-color="#e69a1c"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
 <linearGradient id="ivory" x2="0" y2="1"><stop stop-color="#fffef0"/><stop offset=".45" stop-color="#f4e5c4"/><stop offset="1" stop-color="#cda875"/></linearGradient>
