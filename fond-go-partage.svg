<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#20b9e9"/><stop offset=".48" stop-color="#75d7f2"/><stop offset="1" stop-color="#ffe58a"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#fff18a"/><stop offset=".48" stop-color="#ffbf45"/><stop offset="1" stop-color="#ed7834"/></linearGradient>
 <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#ff6d58"/><stop offset=".52" stop-color="#ed304f"/><stop offset="1" stop-color="#a91d55"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#45d9ef"/><stop offset=".5" stop-color="#168dc8"/><stop offset="1" stop-color="#164b9a"/></linearGradient>
 <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#d58aff"/><stop offset=".55" stop-color="#9252d5"/><stop offset="1" stop-color="#58349d"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff5a8"/><stop offset=".45" stop-color="#ffca36"/><stop offset="1" stop-color="#d97716"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#a8f06d"/><stop offset=".55" stop-color="#35b968"/><stop offset="1" stop-color="#167b65"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="20"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="sparkle" width="95" height="95" patternUnits="userSpaceOnUse"><path d="M48 8l5 30 30 10-30 5-5 30-5-30-30-5 30-10z" fill="#fff" opacity=".25"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<circle cx="220" cy="170" r="260" fill="url(#glow)"/>
<circle cx="1370" cy="185" r="300" fill="url(#glow)"/>
<g fill="#fff" opacity=".65"><ellipse cx="250" cy="230" rx="125" ry="28"/><ellipse cx="330" cy="220" rx="80" ry="36"/><ellipse cx="1280" cy="265" rx="150" ry="30"/><ellipse cx="1370" cy="250" rx="90" ry="38"/></g>
<!-- bâtiment monumental en perspective, avec volumes et ombres -->
<g filter="url(#shadow)">
 <!-- base profonde -->
 <path d="M205 720L800 825l595-105-595-95z" fill="#6a328e" stroke="#f9cf50" stroke-width="12"/>
 <path d="M205 720L800 825v38L205 760z" fill="#4c247c"/>
 <path d="M800 825l595-105v40L800 863z" fill="#341f72"/>
 <!-- ailes latérales -->
 <path d="M265 390L800 285l535 105v300L800 790 265 690z" fill="url(#wall)" stroke="#a94c30" stroke-width="12"/>
 <path d="M265 390L800 495v295L265 690z" fill="#f4a43c" opacity=".65"/>
 <path d="M800 495l535-105v300L800 790z" fill="#df7137" opacity=".55"/>
 <!-- fronton en relief -->
 <path d="M190 390L800 125l610 265-610 125z" fill="url(#roof)" stroke="#ffdc59" stroke-width="15" stroke-linejoin="round"/>
 <path d="M260 385L800 165l540 220-540 110z" fill="#ff8b42" opacity=".45"/>
 <path d="M800 125v370" stroke="#a51f55" stroke-width="12" opacity=".55"/>
 <path d="M235 390L800 150l565 240" fill="none" stroke="#fff2a0" stroke-width="10" opacity=".9"/>
 <!-- dôme / couronne -->
 <path d="M575 260Q800 25 1025 260L1025 310 575 310z" fill="url(#gold)" stroke="#a95a28" stroke-width="10"/>
 <path d="M620 252Q800 70 980 252" fill="none" stroke="#fff7b7" stroke-width="13"/>
 <path d="M800 70v-35" stroke="#9d3c67" stroke-width="12"/><circle cx="800" cy="28" r="20" fill="#ffec75" stroke="#9d3c67" stroke-width="8"/>
 <!-- bandeaux et moulures -->
 <path d="M245 390L800 505l555-115v48L800 555 245 438z" fill="url(#gold)" stroke="#a85c28" stroke-width="8"/>
 <path d="M245 685L800 790l555-105v38L800 830 245 725z" fill="url(#gold)" stroke="#a85c28" stroke-width="8"/>
 <!-- colonnes épaisses, faces en surbrillance -->
 <g stroke="#9b542a" stroke-width="9">
  <path d="M365 440l72 15v225l-72-14z" fill="url(#blue)"/><path d="M437 455l20 5v225l-20-5z" fill="#77edee"/>
  <path d="M570 480l75 15v245l-75-15z" fill="url(#purple)"/><path d="M645 495l20 4v245l-20-4z" fill="#e2a2ff"/>
  <path d="M955 495l75-15v245l-75 15z" fill="url(#green)"/><path d="M955 495l-20 4v245l20-4z" fill="#d7ff94"/>
  <path d="M1165 455l72-15v225l-72 14z" fill="url(#blue)"/><path d="M1165 455l-20 5v225l20-5z" fill="#85f3f1"/>
 </g>
 <!-- fenêtres en arche -->
 <g stroke="#ffe68a" stroke-width="10">
  <path d="M480 475q45-75 90 0v180l-90-18z" fill="#183d86"/>
  <path d="M700 520q50-90 100 0v205l-100-20z" fill="#173b7c"/>
  <path d="M900 520q50-90 100 0v185l-100 20z" fill="#173b7c"/>
  <path d="M1080 475q45-75 90 0v162l-90 18z" fill="#183d86"/>
 </g>
 <g fill="none" stroke="#74e9f0" stroke-width="8" opacity=".9"><path d="M525 500v150M750 535v174M950 535v174M1125 500v150"/></g>
 <!-- porte centrale en arche -->
 <path d="M735 650q0-105 65-105t65 105v125l-130-25z" fill="#8d3fba" stroke="#ffdf62" stroke-width="12"/>
 <path d="M760 660q0-72 40-72t40 72v102l-80-15z" fill="#143b7c" stroke="#f9a93b" stroke-width="7"/>
 <circle cx="820" cy="705" r="7" fill="#ffe77b"/>
 <!-- escalier en perspective -->
 <path d="M615 785l185 35 185-35-185-35z" fill="#fff0a0" stroke="#a75c37" stroke-width="8"/>
 <path d="M650 805l150 29 150-29-150-29z" fill="url(#purple)" stroke="#ffe27b" stroke-width="7"/>
 <path d="M685 825l115 22 115-22-115-22z" fill="url(#blue)" stroke="#ffe27b" stroke-width="7"/>
</g>
<!-- fanions colorés et étoiles -->
<g filter="url(#shadow)"><path d="M160 330l90-40v90z" fill="#ffdc3e" stroke="#d34b40" stroke-width="7"/><path d="M1440 330l-90-40v90z" fill="#55db79" stroke="#247f85" stroke-width="7"/></g>
<g fill="url(#gold)" stroke="#b36a23" stroke-width="5"><path d="M145 520l14 36 39 3-30 25 9 38-32-21-33 21 10-38-30-25 39-3z"/><path d="M1450 520l14 36 39 3-30 25 9 38-32-21-33 21 10-38-30-25 39-3z"/></g>
<!-- gros jetons en relief sur les côtés, sans cartes -->
<g filter="url(#shadow)"><ellipse cx="185" cy="785" rx="72" ry="27" fill="#8e4bc0"/><ellipse cx="185" cy="766" rx="72" ry="27" fill="url(#gold)" stroke="#fff0a0" stroke-width="9"/><ellipse cx="1410" cy="785" rx="72" ry="27" fill="#8e4bc0"/><ellipse cx="1410" cy="766" rx="72" ry="27" fill="url(#gold)" stroke="#fff0a0" stroke-width="9"/></g>
<!-- plateau multicolore au premier plan -->
<g transform="translate(0 870)">
 <path d="M0 0H1600V130H0z" fill="#173b76" stroke="#fbd85a" stroke-width="12"/>
 <g stroke="#fff1ba" stroke-width="7">
  <path d="M25 22h150v82H25z" fill="#ff4d48"/><path d="M195 22h150v82H195z" fill="#ffce32"/><path d="M365 22h150v82H365z" fill="#41c96b"/><path d="M535 22h150v82H535z" fill="#2e9be8"/><path d="M705 22h150v82H705z" fill="#ff8a37"/><path d="M875 22h150v82H875z" fill="#a45de1"/><path d="M1045 22h150v82h-150z" fill="#ff4d48"/><path d="M1215 22h150v82h-150z" fill="#ffce32"/><path d="M1385 22h150v82h-150z" fill="#41c96b"/>
 </g>
 <g fill="#fff6d7" opacity=".9"><circle cx="100" cy="62" r="14"/><path d="M250 42h40v40h-40z"/><circle cx="440" cy="62" r="14"/><path d="M590 42h40v40h-40z"/><circle cx="780" cy="62" r="14"/><path d="M930 42h40v40h-40z"/><circle cx="1120" cy="62" r="14"/><path d="M1270 42h40v40h-40z"/><circle cx="1460" cy="62" r="14"/></g>
</g>
<rect width="1600" height="1000" fill="url(#sparkle)" opacity=".4"/>
<!-- voile léger pour conserver la lisibilité des panneaux -->
<rect width="1600" height="1000" fill="#fff7df" opacity=".09"/>
</svg>