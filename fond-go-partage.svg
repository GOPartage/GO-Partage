 <linearGradient id="stoneSide" x2="1" y2=".3"><stop stop-color="#9a7651"/><stop offset=".45" stop-color="#d1b28a"/><stop offset="1" stop-color="#806044"/></linearGradient>
 <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#75d8ff"/><stop offset=".18" stop-color="#247ebd"/><stop offset=".48" stop-color="#15518e"/><stop offset=".78" stop-color="#0b315e"/><stop offset="1" stop-color="#071e42"/></linearGradient>
