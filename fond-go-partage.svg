 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#a4d9dd"/><stop offset=".18" stop-color="#3d8796"/><stop offset=".6" stop-color="#17465d"/><stop offset="1" stop-color="#0b263c"/></linearGradient>
 <linearGradient id="glassLight" x2="1" y2="1"><stop stop-color="#e1f4e8" stop-opacity=".85"/><stop offset=".4" stop-color="#8cc6c8" stop-opacity=".2"/><stop offset="1" stop-color="#061d32" stop-opacity=".45"/></linearGradient>
