<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#79d9ff"/><stop offset=".48" stop-color="#b8eaff"/><stop offset="1" stop-color="#f7c7f2"/></linearGradient>
