<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#6554a4">

  <title>GO Partage</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f3fa;

      color: #29243a;

    }

    header {

      background: #6554a4;

      color: white;

      padding: 28px 20px;

      text-align: center;

    }

    header h1 { margin: 0 0 8px; }

    header p { margin: 0; }

    main {

      max-width: 650px;

      margin: auto;

      padding: 20px;

    }

    .welcome {

      background: white;

      padding: 22px;

      border-radius: 16px;

      margin-bottom: 18px;

    }

    .menu {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

    }

    .item {

      background: white;

      border-radius: 14px;

      padding: 22px 12px;

      text-align: center;

      font-weight: bold;

      box-shadow: 0 2px 8px #0000000d;

    }

    .item span {

      display: block;

      font-size: 28px;

      margin-bottom: 10px;

    }

    footer {

      text-align: center;

      padding: 25px;

      color: #777;

      font-size: 13px;

    }

  </style>

</head>

<body>

  <header>

    <h1>🎁 GO Partage</h1>

    <p>Ensemble, partageons nos cartes !</p>

  </header>

  <main>

    <section class="welcome">

      <h2>Bienvenue sur GO Partage !</h2>

      <p>L'application pour donner, rechercher et échanger tes cartes avec la communauté.</p>

    </section>

    <section class="menu">

      <div class="item"><span>📚</span>Mes albums</div>

      <div class="item"><span>🃏</span>Mes cartes</div>

      <div class="item"><span>🎁</span>Mes dons</div>

      <div class="item"><span>🔄</span>Échanges</div>

      <div class="item"><span>👤</span>Mon compte</div>

      <div class="item"><span>💬</span>Suggestions</div>

    </section>

  </main>

  <footer>GO Partage · Projet communautaire</footer>

</body>

</html>
